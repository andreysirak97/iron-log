<title>IRON LOG 3 — Дневник и техника</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f31;--panel2:#1c2940;--line:#2d3b53;--text:#f4f7fb;--muted:#9aa9bd;--accent:#b9f34b;--blue:#67a9ff;--green:#3bd18b;--red:#ff7272;--amber:#ffca68;--r:17px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at 85% -15%,#243754 0,transparent 38%),var(--bg);color:var(--text);padding:0 0 calc(30px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.wrap{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px 0}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}.logo{font-weight:950;letter-spacing:2px;font-size:14px}.logo span{color:var(--accent)}.headbtns{display:flex;gap:7px}.ic{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
h1{font-size:26px;margin:5px 0 3px;letter-spacing:-.6px}.muted{color:var(--muted)}.tiny{font-size:11px}.sub{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:#101a2a;border:1px solid var(--line);border-radius:15px;margin:18px 0}.tab{border:0;background:none;color:var(--muted);padding:11px 5px;border-radius:11px;font-size:13px;font-weight:800}.tab.active{background:var(--panel2);color:var(--accent)}
.card{background:linear-gradient(145deg,#1a263a,#141e30);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:11px 0;box-shadow:0 9px 25px #0002}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.row.wraprow{flex-wrap:wrap}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:900;color:var(--muted);text-transform:uppercase}.daytabs{display:flex;gap:7px}.daybtn{border:1px solid var(--line);background:#101a2a;border-radius:30px;padding:9px 15px;font-weight:850;font-size:13px}.daybtn.active{background:var(--accent);color:#18220e;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.stat{background:#101a2a;border-radius:12px;padding:11px}.stat strong{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}
.progress{height:7px;border-radius:20px;background:#2a3850;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--accent);width:0}
h2{font-size:18px;margin:4px 0 10px}.section{font-size:16px;font-weight:900;margin:19px 2px 9px}
.exercise{background:#101a2a;border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.exname{font-weight:850;font-size:15px;line-height:1.25}.exmeta{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:5px}.mini{border:0;border-radius:9px;background:#25344e;padding:7px 9px;color:#dce6f4;font-size:12px}.target{display:inline-block;background:#1e3552;color:#8fc3ff;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:900;margin-top:7px}
.ready{margin:10px 0 0;padding:9px 10px;border-radius:10px;background:#24371c;border:1px solid #456a2d;color:#c8f58a;font-size:12px;font-weight:800}.warning{background:#3c3020;border-color:#6b542d;color:#ffdc9a}
.sethead,.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 42px;gap:6px;align-items:center}.sethead{font-size:10px;color:var(--muted);padding:12px 1px 4px}.setrow{margin-top:7px}.setno{text-align:center;color:var(--muted);font-size:12px}.field{min-width:0;width:100%;border:1px solid #34435b;background:#1b2940;color:var(--text);border-radius:9px;padding:10px 5px;text-align:center;outline:none}.field:focus{border-color:var(--accent)}.check{height:38px;border:0;border-radius:10px;background:#293851;color:#9eafc5;font-weight:900}.check.on{background:var(--green);color:#092016}
.exfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:9px;margin-top:10px}.txtbtn{border:0;background:none;color:var(--blue);font-size:12px;font-weight:800;padding:6px 0}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:900}.primary{background:var(--accent);color:#17210d}.secondary{background:#263650;border:1px solid var(--line);color:var(--text)}.danger{background:#422631;color:#ff9da5;border:1px solid #70404d}.block{width:100%;margin-top:9px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#101a2a;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.time{font-size:27px;font-weight:950;font-variant-numeric:tabular-nums;color:var(--accent)}.timerbtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.timerbtns button{border:0;background:#293851;border-radius:8px;padding:8px 9px;font-size:11px;font-weight:800}
.badge{border-radius:8px;padding:5px 8px;font-size:10px;font-weight:900;background:#293851;color:#c7d5e8}.history{padding:13px 0;border-bottom:1px solid var(--line)}.history:last-child{border:0}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:6px}
.modalbg{position:fixed;inset:0;background:#020712d9;z-index:20;display:none;align-items:flex-end;justify-content:center;padding:10px}.modalbg.show{display:flex}.modal{background:#18253a;border:1px solid var(--line);border-radius:20px 20px 16px 16px;padding:18px;width:min(100%,620px);max-height:90vh;overflow:auto}.modal h2{margin:0 0 14px}.form{margin:11px 0}.form label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:#0e1829;color:var(--text);border-radius:10px;padding:11px}.form textarea{min-height:72px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.timerfloat{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translate(-50%,150%);transition:transform .25s;z-index:10;width:min(92%,420px);background:#1a2940;border:1px solid var(--accent);border-radius:16px;padding:12px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px #0008}.timerfloat.show{transform:translate(-50%,0)}.toast{position:fixed;z-index:30;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--accent);color:#17210d;padding:10px 15px;border-radius:11px;font-size:12px;font-weight:900;display:none;white-space:nowrap}
canvas{width:100%;height:190px;background:#0f1929;border-radius:12px;margin-top:10px}.smallnote{font-size:11px;color:var(--muted);line-height:1.5}.footer{text-align:center;padding:25px 0;color:#687a95;font-size:10px}
@media(min-width:600px){.wrap{padding-left:22px;padding-right:22px}.card{padding:18px}.exercise{padding:16px}}

.guideOpen{display:block;width:100%;text-align:left;background:#21344c;border:1px solid #3b5d76;color:#b9f34b;border-radius:10px;padding:11px;margin-top:10px;font-size:12px;font-weight:850}.guideVisual{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.guideVisual>div{background:#101a2a;border:1px solid #30425d;border-radius:13px;padding:9px;text-align:center}.anatomy,.motion{width:100%;max-height:230px}.moving{transform-origin:100px 110px;animation:exerciseMotion 2.8s ease-in-out infinite alternate}@keyframes exerciseMotion{from{transform:none}to{transform:var(--move)}}@media(prefers-reduced-motion:reduce){.moving{animation:none}}.guideList{line-height:1.55;font-size:13px;padding-left:23px}.guideList li{margin:8px 0}.guideChecks{display:grid;gap:9px}.guideChecks label{background:#101a2a;padding:10px;border-radius:9px;font-size:13px}.guideChecks input{accent-color:#b9f34b}.guideNotice{background:#3c3020;color:#ffdc9a;padding:11px;border-radius:10px;font-size:12px;margin-top:15px}.guideLink{display:block;text-align:center;text-decoration:none}.modal h3{font-size:15px;margin:20px 0 8px}
</style>
</head>

<script>
const GUIDES={"squat":{"title":"Приседания","muscles":"Квадрицепсы, ягодичные; кор стабилизирует","steps":["Стопы устойчиво, корпус напряжён, вдохни перед опусканием.","Сгибай таз и колени одновременно, веди колени по направлению носков.","Опустись настолько, насколько можешь без потери контроля таза и спины.","Поднимись, давя всей стопой в пол; выдохни после сложного участка."],"errors":["Отрыв пяток, завал коленей внутрь","Округление поясницы и потеря контроля ради глубины","Слишком большой вес при нестабильной технике"],"cues":["Вся стопа на полу","Колени по линии носков","Спина стабильна"],"kind":"squat","search":"back squat exercise"},"legpress":{"title":"Жим ногами","muscles":"Квадрицепсы, ягодичные","steps":["Отрегулируй сиденье, прижми таз и поясницу к спинке.","Поставь стопы устойчиво на платформу примерно на ширине плеч.","Опускай платформу до глубины, где таз не подкручивается.","Выжимай платформу, не блокируя колени рывком."],"errors":["Отрыв таза от сиденья","Сведение коленей внутрь","Слишком глубокое опускание с округлением поясницы"],"cues":["Таз прижат","Колени следуют за стопами","Контроль внизу"],"kind":"leg","search":"leg press exercise"},"row":{"title":"Горизонтальная тяга блока","muscles":"Широчайшие, ромбовидные, трапеции; бицепсы","steps":["Сядь устойчиво, сохрани нейтральное положение спины.","Потяни рукоять к нижним рёбрам, ведя локти назад.","В конце движения сведи лопатки без переразгибания поясницы.","Медленно выпрями руки и дай лопаткам двигаться вперёд под контролем."],"errors":["Раскачивание корпусом","Подъём плеч к ушам","Рывки и округление спины"],"cues":["Корпус стабилен","Локти назад","Без рывков"],"kind":"row","search":"seated cable row exercise"},"dbbench":{"title":"Жим гантелей лёжа","muscles":"Большие грудные, трицепсы, передние дельты","steps":["Упрись стопами в пол, сведи и опусти лопатки.","Держи гантели над грудью, запястья над предплечьями.","Плавно опусти гантели по сторонам груди в комфортной амплитуде.","Выжми вверх без удара гантелей друг о друга."],"errors":["Слишком широко разведённые локти","Отрыв таза от скамьи","Провал плеч внизу и потеря контроля"],"cues":["Стопы устойчивы","Лопатки стабильны","Запястья ровные"],"kind":"press","search":"dumbbell bench press exercise"},"barbench":{"title":"Жим штанги лёжа","muscles":"Большие грудные, трицепсы, передние дельты","steps":["Ляг под гриф, стопы устойчиво на полу; используй страховку.","Сведи лопатки, возьми гриф с прямыми запястьями.","Контролируемо опусти к нижней части груди, предплечья почти вертикальны.","Выжми вверх и немного назад по естественной траектории."],"errors":["Отбив штанги от груди","Отрыв таза от скамьи","Жим без страховки при тяжёлом весе"],"cues":["Страховка есть","Лопатки стабильны","Гриф под контролем"],"kind":"press","search":"barbell bench press exercise"},"curl":{"title":"Подъём гантелей на бицепс","muscles":"Бицепс плеча, плечевая мышца","steps":["Встань устойчиво, руки вдоль корпуса, плечи расслаблены.","Сгибай локти, не уводя их далеко вперёд.","Подними гантели без раскачивания туловища.","Плавно опусти, сохраняя контроль до нижней точки."],"errors":["Раскачивание поясницей","Сильное движение плечами","Резкое бросание гантелей вниз"],"cues":["Локти почти на месте","Корпус неподвижен","Плавный негатив"],"kind":"curl","search":"dumbbell biceps curl exercise"},"calfstand":{"title":"Подъёмы на носки стоя","muscles":"Икроножная, камбаловидная","steps":["Встань на устойчивую платформу или тренажёр, держись за опору.","Опусти пятки до комфортного растяжения, не пружинь.","Поднимись на носки максимально высоко под контролем.","Сделай короткую паузу сверху и плавно опустись."],"errors":["Подпрыгивание и инерция","Сгибание коленей ради читинга","Укороченная амплитуда"],"cues":["Пятки вниз под контролем","Высокий подъём","Без пружин"],"kind":"calf","search":"standing calf raise exercise"},"cablecrunch":{"title":"Скручивания в блоке","muscles":"Прямая мышца живота; косые стабилизируют","steps":["Встань на колени перед верхним блоком, держи рукоять у головы.","Зафиксируй таз и положение рук.","Скругляй грудной отдел, приближая рёбра к тазу за счёт пресса.","Медленно верни корпус, не позволяя весу дёрнуть тебя вверх."],"errors":["Сгибание только в тазобедренных суставах","Тяга руками вместо пресса","Рывки большим весом"],"cues":["Рёбра к тазу","Таз почти неподвижен","Не тянуть руками"],"kind":"crunch","search":"kneeling cable crunch exercise"},"rdl":{"title":"Румынская тяга","muscles":"Задняя поверхность бедра, ягодичные; разгибатели спины стабилизируют","steps":["Встань устойчиво, слегка согни колени, держи вес близко к ногам.","Уводи таз назад, наклоняя корпус с нейтральной спиной.","Опускай вес до ощутимого растяжения задней поверхности бедра без округления спины.","Разогни таз, возвращаясь вверх; не переразгибай поясницу."],"errors":["Округление поясницы","Превращение движения в приседание","Увод веса далеко от ног"],"cues":["Таз назад","Вес у ног","Спина нейтральна"],"kind":"hinge","search":"romanian deadlift exercise"},"pulldown":{"title":"Вертикальная тяга блока","muscles":"Широчайшие, большая круглая, бицепсы","steps":["Зафиксируй бёдра под валиками, возьми рукоять комфортным хватом.","Опусти плечи и потяни локти вниз к бокам.","Подведи рукоять к верхней части груди без сильного отклонения корпуса.","Плавно верни руки вверх, сохраняя контроль."],"errors":["Тяга за голову","Сильное раскачивание корпуса","Рывок плечами и локтями"],"cues":["Локти вниз","Грудь открыта","Без раскачки"],"kind":"pull","search":"lat pulldown exercise"},"pullup":{"title":"Подтягивания","muscles":"Широчайшие, бицепсы, мышцы лопаток","steps":["Возьмись за перекладину удобным хватом, начни из контролируемого виса.","Опусти плечи от ушей и веди локти вниз.","Подтяни корпус настолько высоко, насколько позволяет чистая техника.","Опускайся медленно, без резкого падения в плечах."],"errors":["Раскачивание и рывки ногами","Запрокидывание головы ради касания перекладины","Резкий провал в нижней точке"],"cues":["Плечи контролируй","Локти вниз","Без махов"],"kind":"pull","search":"pull up exercise"},"ohp":{"title":"Жим гантелей стоя","muscles":"Дельтовидные, трицепсы; кор стабилизирует","steps":["Встань устойчиво, напряги пресс и ягодицы.","Держи гантели около уровня плеч, предплечья под весом.","Выжми гантели вверх по комфортной траектории.","Опускай плавно, не прогибаясь в пояснице."],"errors":["Сильный прогиб в пояснице","Рывок ногами при строгом жиме","Боль в плечах из-за неудобной траектории"],"cues":["Рёбра над тазом","Пресс напряжён","Без прогиба"],"kind":"overhead","search":"standing dumbbell shoulder press exercise"},"pushdown":{"title":"Разгибания на трицепс в блоке","muscles":"Трицепс плеча","steps":["Встань устойчиво, прижми локти к бокам.","Разогни локти, опуская рукоять вниз без движения плечами.","Внизу контролируемо напряги трицепс.","Медленно верни рукоять, не позволяя локтям уходить вперёд."],"errors":["Раскачивание корпусом","Движение плечами вместо локтей","Слишком тяжёлый вес и короткая амплитуда"],"cues":["Локти на месте","Плечи спокойны","Контроль возврата"],"kind":"push","search":"triceps cable pushdown exercise"},"incline":{"title":"Жим гантелей на наклонной скамье","muscles":"Верхние пучки грудных, передние дельты, трицепсы","steps":["Установи умеренный наклон скамьи примерно 15–30°.","Упрись стопами, стабилизируй лопатки.","Опускай гантели к верхней части груди в комфортной амплитуде.","Выжимай вверх без столкновения гантелей."],"errors":["Слишком большой угол, превращающий жим в плечевой","Разведение локтей строго в стороны","Потеря контакта таза со скамьёй"],"cues":["Умеренный наклон","Лопатки стабильны","Плавная амплитуда"],"kind":"press","search":"incline dumbbell bench press exercise"},"calfseat":{"title":"Подъёмы на носки сидя","muscles":"Камбаловидная; икроножная помогает","steps":["Сядь в тренажёр, подушечки стоп поставь на платформу.","Убедись, что валики устойчиво лежат на бёдрах.","Опусти пятки до комфортного растяжения.","Подни function bindExerciseInputs(){
document.querySelectorAll("[data-guide]").forEach(b=>b.onclick=()=>showGuide(b.dataset.guide));
document.querySelectorAll("[data-field]").forEach(el=>el.onchange=()=>{let e=prog(day).find(x=>x.id===el.dataset.id),s=e.sets[+el.dataset.i],k=el.dataset.field;s[k]=k==="rir"?(el.value===""?"":+el.value):(el.value===""?"":+el.value);persist();if(k==="reps")render()});
document.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{let e=prog(day).find(x=>x.id===b.dataset.check),s=e.sets[+b.dataset.i];s.done=!s.done;persist();if(s.done&&db.settings.auto){resetTimer();startTimer()}render()});
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editExercise(b.dataset.edit));
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteExercise(b.dataset.del));
document.querySelectorAll("[data-add-set]").forEach(b=>b.onclick=()=>{let e=prog(day).find(x=>x.id===b.dataset.addSet),last=e.sets.at(-1)||{};e.sets.push({weight:last.weight??"",reps:"",rir:"",done:false});persist();render()});
document.querySelectorAll("[data-remove-set]").forEach(b=>b.onclick=()=>{let e=prog(day).find(x=>x.id===b.dataset.removeSet);if(e.sets.length<=1){toast("В упражнении должен остаться хотя бы один подход");return}e.sets.splice(+b.dataset.i,1);persist();render()});
document.querySelectorAll("[data-up],[data-down]").forEach(b=>b.onclick=()=>moveExercise(b.dataset.up||b.dataset.down,b.hasAttribute("data-up")?-1:1));
document.querySelectorAll("[data-card]").forEach(card=>{card.ondragstart=()=>{dragId=card.dataset.card};card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();if(!dragId||dragId===card.dataset.card)return;let arr=prog(day),from=arr.findIndex(x=>x.id===dragId),to=arr.findIndex(x=>x.id===card.dataset.card);let [it]=arr.splice(from,1);arr.splice(to,0,it);dragId=null;persist();render()}})
}
function moveExercise(id,dir){let a=prog(day),i=a.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist();render()}
function editExercise(id){let e=id?prog(day).find(x=>x.id===id):null;editing=id;modal(`<h2>${e?"Настроить упражнение":"Добавить упражнение"}</h2><div class="form"><label>Название</label><input id="fName" value="${esc(e?.name||"")}" placeholder="Название упражнения"></div><div class="two"><div class="form"><label>Нижняя граница повторений</label><input id="fMin" type="number" min="1" max="30" value="${e?.min??8}"></div><div class="form"><label>Верхняя граница</label><input id="fMax" type="number" min="1" max="30" value="${e?.target??12}"></div></div><div class="form"><label>Количество рабочих подходов</label><input id="fSets" type="number" min="1" max="12" value="${e?.sets.length??2}"></div><button class="btn primary block" id="saveExercise">Сохранить</button><button class="btn secondary block" id="cancel">Отмена</button>`);
$("#saveExercise").onclick=()=>{let name=$("#fName").value.trim(),min=+$("#fMin").value,max=+$("#fMax").value,n=Math.max(1,Math.min(12,+$("#fSets").value||2));if(!name||min<1||max<min){toast("Проверь название и диапазон");return}if(e){e.name=name;e.min=min;e.target=max;while(e.sets.length<n)e.sets.push({weight:e.sets.at(-1)?.weight??"",reps:"",rir:"",done:false});e.sets=e.sets.slice(0,n)}else prog(day).push({id:uid(),name,min,target:max,sets:Array.from({length:n},()=>({weight:"",reps:"",rir:"",done:false}))});persist();closeModal();render()};
$("#cancel").onclick=closeModal}
function deleteExercise(id){if(!confirm("Удалить упражнение из программы?"))return;let a=prog(day),i=a.findIndex(x=>x.id===id);a.splice(i,1);persist();render()}
function modal(content){$("#modal").innerHTML=content;$("#modalbg").classList.add("show")}
function closeModal(){$("#modalbg").classList.remove("show")}
$("#modalbg").onclick=e=>{if(e.target.id==="modalbg")closeModal()};
function startTimer(){if(timer.running)return;prepareSound();if(timer.left<=0)timer.left=db.settings.rest;alarmDelivered=false;timer.running=true;timer.end=Date.now()+timer.left*1000;timerSave();clearInterval(timer.id);timer.id=setInterval(tick,250);updateTimerUI()}
function pauseTimer(){if(!timer.running)return;timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timer.running=false;clearInterval(timer.id);timer.id=null;timerSave();updateTimerUI()}
function resetTimer(){timer.running=false;clearInterval(timer.id);timer.id=null;timer.left=db.settings.rest;alarmDelivered=false;timerSave();updateTimerUI()}
function adjustTimer(v){if(timer.running){timer.end=Math.max(Date.now(),timer.end+v*1000);timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timerSave();tick()}else{timer.left=Math.max(0,timer.left+v);updateTimerUI()}}
function tick(){if(!timer.running)return;timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));if(timer.left===0){completeTimer();return}updateTimerUI()}
window.addEventListener("focus",tick);window.addEventListener("pageshow",tick);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
function updateTimerUI(){let t=clock(timer.left);$("#timerText").textContent=t;let inline=$("#timerInline");if(inline)inline.textContent=t;$("#timerFloat").classList.toggle("show",timer.running||timer.left!==db.settings.rest);$("#timerPause").textContent=timer.running?"Пауза":"Старт"}
$("#timerMinus").onclick=()=>adjustTimer(-30);$("#timerPlus").onclick=()=>adjustTimer(30);$("#timerPause").onclick=()=>timer.running?pauseTimer():startTimer();$("#timerStop").onclick=()=>{resetTimer();$("#timerFloat").classList.remove("show")};
function finish(){let arr=prog(day),done=arr.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);if(!done&&!confirm("Не отмечено ни одного подхода. Всё равно сохранить занятие?"))return;let note="";let rec={id:uid(),date:today(),created:new Date().toISOString(),day,completed:done,exercises:arr.map(e=>({id:e.id,name:e.name,min:e.min,target:e.target,sets:e.sets.map(s=>({...s}))})),note};db.history.unshift(rec);arr.forEach(e=>e.sets.forEach(s=>s.done=false));db.nextDay=day==="A"?"B":"A";db.active=null;persist();resetTimer();toast("Сохранено. Следующий день: "+db.nextDay);day=db.nextDay;render()}
function renderHistory(){if(!db.history.length){$("#main").innerHTML='<div class="card empty"><b>История пока пуста</b>Заверши первую тренировку — результаты появятся здесь.</div>';return}
$("#main").innerHTML=`<div class="card"><div class="eyebrow">Журнал</div><h2>История тренировок</h2><div class="sub">${db.history.length} сохранённых занятий</div></div><div class="card">${db.history.map(h=>{let volume=h.exercises.reduce((n,e)=>n+e.sets.reduce((m,s)=>m+(+s.weight||0)*(+s.reps||0),0),0);return `<div class="history"><div class="row"><b>День ${h.day} · ${dateFmt(h.date)}</b><span class="badge">${h.completed} подходов</span></div><div class="tiny muted" style="margin:6px 0">${h.exercises.length} упражнений · объём ${Math.round(volume).toLocaleString("ru-RU")} кг</div><div class="row"><button class="txtbtn" data-details="${h.id}">Подробнее →</button><button class="txtbtn" style="color:var(--red)" data-delete-record="${h.id}">Удалить</button></div></div>`}).join("")}</div>`;
document.querySelectorAll("[data-details]").forEach(b=>b.onclick=()=>details(b.dataset.details));document.querySelectorAll("[data-delete-record]").forEach(b=>b.onclick=()=>{if(confirm("Удалить тренировку из истории?")){db.history=db.history.filter(x=>x.id!==b.dataset.deleteRecord);persist();render()}})}
function details(id){let h=db.history.find(x=>x.id===id);modal(`<h2>День ${h.day} · ${dateFmt(h.date)}</h2>${h.exercises.map(e=>`<div class="history"><b>${esc(e.name)}</b><div class="tiny muted" style="margin-top:5px">${e.sets.map((s,i)=>`${i+1}. ${s.weight||0} кг × ${s.reps||0}${s.rir!==""&&s.rir!=null?" · RIR "+s.rir:""}`).join("<br>")}</div></div>`).join("")}<button class="btn secondary block" id="closeDetails">Закрыть</button>`);$("#closeDetails").onclick=closeModal}
function renderStats(){let by={};db.history.slice().reverse().forEach(h=>h.exercises.forEach(e=>{let vals=e.sets.filter(s=>+s.weight>0).map(s=>+s.weight);if(vals.length){by[e.name]??=[];by[e.name].push({date:h.date,max:Math.max(...vals)})}}));let names=Object.keys(by),prs=names.map(n=>({name:n,max:Math.max(...by[n].map(x=>x.max))})).sort((a,b)=>b.max-a.max);let count=db.history.length,vol=db.history.reduce((n,h)=>n+h.exercises.reduce((m,e)=>m+e.sets.reduce((k,s)=>k+(+s.weight||0)*(+s.reps||0),0),0),0);
$("#main").innerHTML=`<div class="card"><div class="eyebrow">Тренировочная аналитика</div><h2>Прогресс</h2><div class="stats"><div class="stat"><strong>${count}</strong><span>тренировок</span></div><div class="stat"><strong>${Math.round(vol).toLocaleString("ru-RU")}</strong><span>кг объёма*</span></div><div class="stat"><strong>${prs.length}</strong><span>упражнений с данными</span></div></div><div class="tiny muted" style="margin-top:8px">*Сумма веса × повторения по сохранённым подходам.</div></div>
<div class="card"><b>Лучшие рабочие веса</b>${prs.length?prs.map(x=>`<div class="history row"><span>${esc(x.name)}</span><b>${x.max} кг</b></div>`).join(""):'<div class="empty">Данные появятся после сохранения занятий.</div>'}</div>
<div class="card"><b>График рабочего веса</b><div class="form"><select id="chartSelect">${names.map(n=>`<option>${esc(n)}</option>`).join("")}</select></div><canvas id="chart" width="640" height="250"></canvas><p class="smallnote">График показывает максимальный записанный вес упражнения в каждой тренировке. Сравнивай только одинаковые варианты упражнения и одинаковую технику.</p></div>
<div class="card"><b>Как работает двойная прогрессия</b><p class="smallnote" style="margin-top:8px">1. Сохраняй выбранный рабочий вес и постепенно добавляй повторения в диапазоне ${prog("A")[0]?.min||8}–${prog("A")[0]?.target||12}.<br>2. Когда первый рабочий подход достигает верхней границы диапазона близко к техническому отказу, на следующем занятии можно увеличить вес минимальным шагом. В последующих подходах допустимо снижение до двух повторений относительно первого.<br>3. После увеличения веса повторения обычно снова окажутся ближе к нижней границе. Продолжай цикл.<br>Подсказка приложения — ориентир, а не требование повышать вес любой ценой. Техника и контроль важнее.</p></div>`;
if(names.length){$("#chartSelect").onchange=drawChart;drawChart()}}
function drawChart(){let name=$("#chartSelect").value,vals=db.history.slice().reverse().map(h=>{let e=h.exercises.find(x=>x.name===name);return e?{date:h.date,v:Math.max(0,...e.sets.map(s=>+s.weight||0))}:null}).filter(x=>x&&x.v>0),c=$("#chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);if(!vals.length)return;let max=Math.max(...vals.map(x=>x.v))*1.15,min=Math.min(...vals.map(x=>x.v))*.85;ctx.strokeStyle="#34445f";ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(25,h*i/4);ctx.lineTo(w-20,h*i/4);ctx.stroke()}ctx.strokeStyle="#b9f34b";ctx.lineWidth=4;ctx.beginPath();vals.forEach((p,i)=>{let x=30+(w-60)*(vals.length===1?.5:i/(vals.length-1)),y=h-28-(p.v-min)/(max-min||1)*(h-60);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();vals.forEach((p,i)=>{let x=30+(w-60)*(vals.length===1?.5:i/(vals.length-1)),y=h-28-(p.v-min)/(max-min||1)*(h-60);ctx.fillStyle="#b9f34b";ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e9f2ff";ctx.font="18px system-ui";ctx.fillText(p.v+"кг",x-20,y-13)})}
$("#backup").onclick=()=>{modal(`<h2>Резервная копия</h2><p class="smallnote">Экспортируй программу, настройки и историю в JSON. Импорт восстановит данные из такого файла.</p><button class="btn primary block" id="export">Скачать резервную копию</button><button class="btn secondary block" id="import">Восстановить из файла</button><button class="btn secondary block" id="closeBackup">Закрыть</button>`);$("#export").onclick=exportData;$("#import").onclick=()=>{$("#file").click();closeModal()};$("#closeBackup").onclick=closeModal};
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="iron-log-v2-"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("Резервная копия скачана")}
$("#file").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.program||!Array.isArray(x.history))throw 0;if(confirm("Импорт заменит текущие данные. Продолжить?")){db=migrateProgram(x);db.settings={rest:150,auto:true,step:2.5,sound:true,vibration:true,notifications:true,...db.settings};persist();render();toast("Данные восстановлены")}}catch(_){alert("Файл не похож на резервную копию IRON LOG")}e.target.value=""};
$("#settings").onclick=()=>{modal(`<h2>Настройки</h2><div class="form"><label>Отдых по умолчанию, секунд</label><input id="rest" type="number" min="15" max="900" value="${db.settings.rest}"></div><div class="form"><label>Автозапуск таймера после отметки подхода</label><select id="auto"><option value="true" ${db.settings.auto?"selected":""}>Включён</option><option value="false" ${!db.settings.auto?"selected":""}>Выключен</option></select></div><div class="form"><label>Звуковой сигнал</label><select id="sound"><option value="true" ${db.settings.sound!==false?"selected":""}>Включён</option><option value="false" ${db.settings.sound===false?"selected":""}>Выключен</option></select></div><div class="form"><label>Вибрация</label><select id="vibration"><option value="true" ${db.settings.vibration!==false?"selected":""}>Включена</option><option value="false" ${db.settings.vibration===false?"selected":""}>Выключена</option></select></div><div class="form"><label>Системные уведомления (если поддерживаются)</label><select id="notifications"><option value="true" ${db.settings.notifications!==false?"selected":""}>Включены</option><option value="false" ${db.settings.notifications===false?"selected":""}>Выключены</option></select><button class="btn secondary block" id="requestNotifications" type="button">Разрешить уведомления</button><p class="smallnote">Разрешение само по себе не гарантирует сигнал при заблокированном экране. Повторного сигнала через 30 секунд нет.</p></div><div class="form"><label>Шаг увеличения веса (подсказка)</label><input id="step" type="number" min=".25" max="20" step=".25" value="${db.settings.step}"></div><button class="btn primary block" id="saveSettings">Сохранить</button><button class="btn secondary block" id="resetProgram">Сбросить программу к исходной</button><button class="btn danger block" id="clearHistory">Очистить историю</button><button class="btn secondary block" id="closeSettings">Закрыть</button>`);
$("#requestNotifications").onclick=enableNotifications;
$("#saveSettings").onclick=()=>{db.settings.sound=$("#sound").value==="true";db.settings.vibration=$("#vibration").value==="true";db.settings.notifications=$("#notifications").value==="true";db.settings.rest=Math.max(15,Math.min(900,+$("#rest").value||150));db.settings.auto=$("#auto").value==="true";db.settings.step=Math.max(.25,+$("#step").value||2.5);persist();resetTimer();closeModal();render();toast("Настройки сохранены")};
$("#resetProgram").onclick=()=>{if(confirm("Вернуть исходные упражнения и веса? История сохранится.")){db.program=structuredClone(seed);persist();closeModal();render()}};
$("#clearHistory").onclick=()=>{if(confirm("Безвозвратно очистить историю?")){db.history=[];persist();closeModal();render()}};
$("#closeSettings").onclick=closeModal};
if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
restoreTimer();
render();
</script>
</body></html>
