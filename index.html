<title>IRON LOG 4.1.1 — Дневник, аналитика и техника</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f31;--panel2:#1c2940;--line:#2d3b53;--text:#f4f7fb;--muted:#9aa9bd;--accent:#b9f34b;--blue:#67a9ff;--green:#3bd18b;--red:#ff7272;--amber:#ffca68;--r:17px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at 85% -15%,#243754 0,transparent 38%),var(--bg);color:var(--text);padding:0 0 calc(30px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.wrap{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px 0}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}.logo{font-weight:950;letter-spacing:2px;font-size:14px}.logo span{color:var(--accent)}.headbtns{display:flex;gap:7px}.ic{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
h1{font-size:26px;margin:5px 0 3px;letter-spacing:-.6px}.muted{color:var(--muted)}.tiny{font-size:11px}.sub{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:#101a2a;border:1px solid var(--line);border-radius:15px;margin:18px 0}.tab{border:0;background:none;color:var(--muted);padding:11px 5px;border-radius:11px;font-size:13px;font-weight:800}.tab.active{background:var(--panel2);color:var(--accent)}
.card{background:linear-gradient(145deg,#1a263a,#141e30);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:11px 0;box-shadow:0 9px 25px #0002}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.row.wraprow{flex-wrap:wrap}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:900;color:var(--muted);text-transform:uppercase}.daytabs{display:flex;gap:7px}.daybtn{border:1px solid var(--line);background:#101a2a;border-radius:30px;padding:9px 15px;font-weight:850;font-size:13px}.daybtn.active{background:var(--accent);color:#18220e;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.stat{background:#101a2a;border-radius:12px;padding:11px}.stat strong{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}
.progress{height:7px;border-radius:20px;background:#2a3850;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--accent);width:0}
h2{font-size:18px;margin:4px 0 10px}.section{font-size:16px;font-weight:900;margin:19px 2px 9px}
.exercise{background:#101a2a;border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}.exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.exname{font-weight:850;font-size:15px;line-height:1.25}.exmeta{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:5px}.mini{border:0;border-radius:9px;background:#25344e;padding:7px 9px;color:#dce6f4;font-size:12px}.target{display:inline-block;background:#1e3552;color:#8fc3ff;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:900;margin-top:7px}
.ready{margin:10px 0 0;padding:9px 10px;border-radius:10px;background:#24371c;border:1px solid #456a2d;color:#c8f58a;font-size:12px;font-weight:800}.warning{background:#3c3020;border-color:#6b542d;color:#ffdc9a}
.sethead,.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 42px;gap:6px;align-items:center}.sethead{font-size:10px;color:var(--muted);padding:12px 1px 4px}.setrow{margin-top:7px}.setno{text-align:center;color:var(--muted);font-size:12px}.field{min-width:0;width:100%;border:1px solid #34435b;background:#1b2940;color:var(--text);border-radius:9px;padding:10px 5px;text-align:center;outline:none}.field:focus{border-color:var(--accent)}.check{height:38px;border:0;border-radius:10px;background:#293851;color:#9eafc5;font-weight:900}.check.on{background:var(--green);color:#092016}
.exfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:9px;margin-top:10px}.txtbtn{border:0;background:none;color:var(--blue);font-size:12px;font-weight:800;padding:6px 0}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:900}.primary{background:var(--accent);color:#17210d}.secondary{background:#263650;border:1px solid var(--line);color:var(--text)}.danger{background:#422631;color:#ff9da5;border:1px solid #70404d}.block{width:100%;margin-top:9px}
.timer{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#101a2a;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.time{font-size:27px;font-weight:950;font-variant-numeric:tabular-nums;color:var(--accent)}.timerbtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.timerbtns button{border:0;background:#293851;border-radius:8px;padding:8px 9px;font-size:11px;font-weight:800}
.badge{border-radius:8px;padding:5px 8px;font-size:10px;font-weight:900;background:#293851;color:#c7d5e8}.history{padding:13px 0;border-bottom:1px solid var(--line)}.history:last-child{border:0}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:6px}
.modalbg{position:fixed;inset:0;background:#020712d9;z-index:20;display:none;align-items:flex-end;justify-content:center;padding:10px}.modalbg.show{display:flex}.modal{background:#18253a;border:1px solid var(--line);border-radius:20px 20px 16px 16px;padding:18px;width:min(100%,620px);max-height:90vh;overflow:auto}.modal h2{margin:0 0 14px}.form{margin:11px 0}.form label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:#0e1829;color:var(--text);border-radius:10px;padding:11px}.form textarea{min-height:72px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.timerfloat{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translate(-50%,150%);transition:transform .25s;z-index:10;width:min(92%,420px);background:#1a2940;border:1px solid var(--accent);border-radius:16px;padding:12px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px #0008}.timerfloat.show{transform:translate(-50%,0)}.toast{position:fixed;z-index:30;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--accent);color:#17210d;padding:10px 15px;border-radius:11px;font-size:12px;font-weight:900;display:none;white-space:nowrap}
canvas{width:100%;height:190px;background:#0f1929;border-radius:12px;margin-top:10px}.smallnote{font-size:11px;color:var(--muted);line-height:1.5}.summaryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}.summaryGrid .stat{min-height:75px}.summaryGrid strong{font-size:20px}.reportBox{width:100%;min-height:190px;background:#0e1829;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font:12px/1.5 ui-monospace,monospace;resize:vertical}.footer{text-align:center;padding:25px 0;color:#687a95;font-size:10px}
@media(min-width:600px){.wrap{padding-left:22px;padding-right:22px}.card{padding:18px}.exercise{padding:16px}}

.guideOpen{display:block;width:100%;text-align:left;background:#21344c;border:1px solid #3b5d76;color:#b9f34b;border-radius:10px;padding:11px;margin-top:10px;font-size:12px;font-weight:850}.guideVisual{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.guideVisual>div{background:#101a2a;border:1px solid #30425d;border-radius:13px;padding:9px;text-align:center}.anatomy,.motion{width:100%;max-height:230px}.moving{transform-origin:100px 110px;animation:exerciseMotion 2.8s ease-in-out infinite alternate}@keyframes exerciseMotion{from{transform:none}to{transform:var(--move)}}@media(prefers-reduced-motion:reduce){.moving{animation:none}}.guideList{line-height:1.55;font-size:13px;padding-left:23px}.guideList li{margin:8px 0}.guideChecks{display:grid;gap:9px}.guideChecks label{background:#101a2a;padding:10px;border-radius:9px;font-size:13px}.guideChecks input{accent-color:#b9f34b}.guideNotice{background:#3c3020;color:#ffdc9a;padding:11px;border-radius:10px;font-size:12px;margin-top:15px}.guideLink{display:block;text-align:center;text-decoration:none}.modal h3{font-size:15px;margin:20px 0 8px}
.guidePhoto{margin:14px 0;background:#101a2a;border:1px solid #30425d;border-radius:14px;overflow:hidden}.guidePhoto img{display:block;width:100%;max-height:350px;object-fit:contain;background:#151b25}.photoCaption{padding:9px 12px;color:var(--muted);font-size:11px}.musclePanel{background:#14253a;border:1px solid #30425d;border-radius:12px;padding:14px}.musclePanel p{font-size:14px;line-height:1.5;margin:8px 0 0}.guideVisual{display:none}
.guideTabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:14px 0 8px}.guideTab{font-size:11px;padding:10px 2px;background:#0e1829;color:#c7d3e5;border:1px solid #35465f;border-radius:9px;cursor:pointer}.guideTab.selected{background:#b9f34b;color:#12210b;border-color:#b9f34b;font-weight:900}.guideContent{min-height:220px}.anatomyPhoto img{max-height:480px;background:#f5f0e8}.phaseCard{background:#111f32;border:1px solid #35465f;border-radius:12px;margin:10px 0;padding:14px}.phaseCard b{color:#b9f34b}.phaseCard p{line-height:1.55;font-size:13px;margin:7px 0 0}@media(max-width:370px){.guideTab{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">IRON <span>LOG</span> / V4.2</div><div class="headbtns"><button class="ic" id="backup">⇧</button><button class="ic" id="settings">⚙</button></div></header>
<div class="row"><div><h1>Дневник тренировок</h1><div class="sub" id="dateLabel"></div></div><span class="badge">DOUBLE PROGRESSION</span></div>
<nav class="tabs"><button class="tab active" data-tab="train">Тренировка</button><button class="tab" data-tab="history">История</button><button class="tab" data-tab="stats">Прогресс</button></nav>
<main id="main"></main><div class="footer">IRON LOG V4.2 · Локальное хранение · Сделай резервную копию перед сменой устройства</div>
</div>

<script>
const GUIDES={"squat":{"title":"Приседания","muscles":"Квадрицепсы, ягодичные; кор стабилизирует","steps":["Стопы устойчиво, корпус напряжён, вдохни перед опусканием.","Сгибай таз и колени одновременно, веди колени по направлению носков.","Опустись настолько, насколько можешь без потери контроля таза и спины.","Поднимись, давя всей стопой в пол; выдохни после сложного участка."],"errors":["Отрыв пяток, завал коленей внутрь","Округление поясницы и потеря контроля ради глубины","Слишком большой вес при нестабильной технике"],"cues":["Вся стопа на полу","Колени по линии носков","Спина стабильна"],"kind":"squat","search":"back squat exercise"},"legpress":{"title":"Жим ногами","muscles":"Квадрицепсы, ягодичные","steps":["Отрегулируй сиденье, прижми таз и поясницу к спинке.","Поставь стопы устойчиво на платформу примерно на ширине плеч.","Опускай платформу до глубины, где таз не подкручивается.","Выжимай платформу, не блокируя колени рывком."],"errors":["Отрыв таза от сиденья","Сведение коленей внутрь","Слишком глубокое опускание с округлением поясницы"],"cues":["Таз прижат","Колени следуют за стопами","Контроль внизу"],"kind":"leg","search":"leg press exercise"},"row":{"title":"Горизонтальная тяга блока","muscles":"Широчайшие, ромбовидные, трапеции; бицепсы","steps":["Сядь устойчиво, сохрани нейтральное положение спины.","Потяни рукоять к нижним рёбрам, ведя локти назад.","В конце движения сведи лопатки без переразгибания поясницы.","Медленно выпрями руки и дай лопаткам двигаться вперёд под контролем."],"errors":["Раскачивание корпусом","Подъём плеч к ушам","Рывки и округление спины"],"cues":["Корпус стабилен","Локти назад","Без рывков"],"kind":"row","search":"seated cable row exercise"},"dbbench":{"title":"Жим гантелей лёжа","muscles":"Большие грудные, трицепсы, передние дельты","steps":["Упрись стопами в пол, сведи и опусти лопатки.","Держи гантели над грудью, запястья над предплечьями.","Плавно опусти гантели по сторонам груди в комфортной амплитуде.","Выжми вверх без function fresh(){return {programVersion:42,program:structuredClone(seed),history:[],settings:{rest:90,exerciseRest:150,bodyWeight:74,intensity:4.5,cardioGoal:5,auto:true,step:2.5,sound:true,vibration:true,notifications:true},active:null,nextDay:"A"}}
function migrateProgram(x){
 if(x.programVersion>=42)return x;
 // Existing user data remains untouched until they explicitly opt into the new program.
 x.programVersion=x.programVersion||35;
 return x;
}
function applyProgram42(){
 if(!confirm("Установить новую программу Full Body A/B? История останется без изменений. Текущие упражнения и подходы будут заменены, рабочие веса совпадающих упражнений перенесутся. Сначала сделай резервную копию."))return;
 let old=[...(db.program.dayA||[]),...(db.program.dayB||[])];
 let freshProgram=structuredClone(seed);
 for(let key of ["dayA","dayB"])for(let e of freshProgram[key]){
  let oldE=old.find(z=>z.id===e.id);
  if(oldE){let work=oldE.sets.filter(z=>z.kind!=="warmup");let saved=work.map(z=>z.weight).filter(v=>v!==""&&v!=null);if(saved.length)e.sets.forEach((z,i)=>{z.weight=saved[Math.min(i,saved.length-1)]});}
 }

}

function prepareSound(){if(!db.settings.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();if(audioCtx.state==="suspended")audioCtx.resume().catch(()=>{})}catch(e){}}
function playAlarm(){if(!db.settings.sound||!audioCtx||audioCtx.state!=="running")return;try{let now=audioCtx.currentTime;for(let i=0;i<3;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.0001,now+i*.32);g.gain.exponentialRampToValueAtTime(.2,now+i*.32+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.32+.23);o.connect(g).connect(audioCtx.destination);o.start(now+i*.32);o.stop(now+i*.32+.25)}}catch(e){}}
async function enableNotifications(){if(!("Notification" in window)){toast("Уведомления не поддерживаются этим браузером");return}if(!isSecureContext){toast("Нужен HTTPS для уведомлений");return}try{let permission=await Notification.requestPermission();toast(permission==="granted"?"Уведомления разрешены":"Разрешение на уведомления не получено")}catch(e){toast("Не удалось запросить разрешение")}}
async function sendRestNotification(){if(!db.settings.notifications||!("Notification" in window)||Notification.permission!=="granted")return;try{if("serviceWorker" in navigator){let reg=await navigator.serviceWorker.ready;await reg.showNotification("IRON LOG · Отдых завершён",{body:timer.kind==="exercise"?"Отдых между упражнениями завершён":"Пора начинать следующий подход",icon:"./icon.svg",tag:"ironlog-rest",renotify:false});}else if(!document.hidden){new Notification("IRON LOG · Отдых завершён",{body:timer.kind==="exercise"?"Отдых между упражнениями завершён":"Пора начинать следующий подход"})}}catch(e){}}
function completeTimer(){if(alarmDelivered)return;alarmDelivered=true;clearInterval(timer.id);timer.id=null;timer.running=false;timer.left=0;timerSave();updateTimerUI();playAlarm();if(db.settings.vibration&&navigator.vibrate)try{navigator.vibrate([300,150,300])}catch(e){}sendRestNotification();toast(timer.kind==="exercise"?"Отдых окончен — следующее упражнение":"Отдых окончен — следующий подход")}
function restoreTimer(){try{let x=JSON.parse(localStorage.getItem(TIMER_STORE)||"null");if(!x||!Number.isFinite(x.end))return;let remain=Math.ceil((x.end-Date.now())/1000);if(remain>0&&remain<=900){timer.end=x.end;timer.left=remain;timer.kind=x.kind==="exercise"?"exercise":"set";timer.running=true;alarmDelivered=false;timer.id=setInterval(tick,250)}else{localStorage.removeItem(TIMER_STORE);timer.left=db.settings.rest;timer.kind="set"}}catch(e){}}

function persist(){localStorage.setItem("ironlog_v2",JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateFmt(s){return new Date(s+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
function toast(s){let t=$("#toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2300)}
function clock(n){return String(Math.floor(Math.max(0,n)/60)).padStart(2,"0")+":"+String(Math.max(0,n)%60).padStart(2,"0")}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#dateLabel").textContent=new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});if(tab==="train")renderTrain();if(tab==="history")renderHistory();if(tab==="stats")renderStats();updateTimerUI()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function prog(dayKey){return db.program[dayKey==="A"?"dayA":"dayB"]}
function lastExercise(name,dayKey){for(let h of db.history){if(h.day===dayKey){let e=h.exercises.find(x=>x.name===name);if(e)return e}}return null}
function progression(ex,dayKey){let prev=lastExercise(ex.name,dayKey);let first=ex.sets.find(s=>s.kind!=="warmup");let firstTop=!!first&&first.done&&first.reps!==""&&Number(first.reps)>=ex.target;let allMin=ex.sets.some(s=>s.kind!=="warmup")&&ex.sets.filter(s=>s.kind!=="warmup").every(s=>s.done&&s.reps!==""&&Number(s.reps)>=ex.min);if(firstTop)return {type:"up",text:"Первый рабочий подход достиг "+ex.target+" повторений. Продолжай с текущим весом; прибавку оцени после всех рабочих подходов с учётом RIR и техники."};if(allMin)return {type:"good",text:"Все подходы в диапазоне. Сохраняй вес и постепенно добавляй повторения; ориентир прогрессии — первый рабочий подход."};if(prev)return {type:"hold",text:"Сохраняй вес и постепенно улучшай повторения. Не форсируй отказ ценой нарушения техники."};return {type:"info",text:"Стартовый ориентир: "+ex.min+"–"+ex.target+" повторений. Подбери вес, с которым первый рабочий подход подходит близко к техническому отказу."}}
function nextSetAdvice(e,i){
 const s=e.sets[i],w=Number(s.weight)||0,r=Number(s.reps)||0;
 if(!r)return "Укажи число повторений, чтобы получить подсказку.";
 const rir=s.rir===""||s.rir==null?null:Number(s.rir);
 const next=e.sets.slice(i+1).find(x=>!x.done&&x.kind!=="warmup");
 const label=next?"Следующий рабочий подход":"Следующая тренировка";
 const weight=w?`${w} кг`:"текущий вес";
 if(s.kind==="warmup")return "Разминка завершена. Оцени технику и готовность, затем переходи к рабочему весу без отказа.";
 if(rir===null)return `${label}: начни с ${weight}. Укажи RIR для более точной рекомендации.`;
 if(rir>=4)return `${label}: ${weight}; нагрузка была лёгкой (RIR ${rir}). Если техника уверенная, можно увеличить вес минимальным шагом.`;
 if(r<e.min)return `${label}: снизь вес на небольшой шаг или увеличь отдых, чтобы вернуться в диапазон ${e.min}–${e.target}.`;
 if(r>=e.target&&rir>=1&&rir<=2)return `${label}: оставь ${weight}. Повышай вес на следующей тренировке, только если все рабочие подходы достигнут верхней границы диапазона с хорошей техникой.`;
 if(rir===0)return `${label}: не увеличивай вес; после отказа возможен спад повторений. Оставь ${weight} или снизь нагрузку при ухудшении техники.`;
 return `${label}: ${weight}, цель ${Math.max(e.min,Math.min(e.target,r+1))} повторений при RIR 1–2. Если усталость нарастает, допустимо меньше повторений.`;
}
function showSetAdvice(e,i){const t=nextSetAdvice(e,i);modal(`<h2>Подсказка после подхода</h2><p class="smallnote">${esc(e.name)} · подход ${i+1}</p><div class="ready">${esc(t)}</div><p class="smallnote">Рекомендация ориентировочная: техника, самочувствие и запас повторений важнее чисел.</p><button class="btn primary block" id="closeSetAdvice">Понятно</button>`);$("#closeSetAdvice").onclick=closeModal}

$("#main").innerHTML=`<section class="card"><div class="row"><div><div class="eyebrow">Программа</div><h2 style="font-size:21px;margin:4px 0">Full Body A/B</h2><div class="sub">Следующее занятие: День ${db.nextDay}</div>${db.programVersion<42?`<button class="btn secondary block" id="apply42">Установить новую программу A/B (с сохранением истории)</button>`:""}</div><div class="daytabs"><button class="daybtn ${day==="A"?"active":""}" data-day="A">А</button><button class="daybtn ${day==="B"?"active":""}" data-day="B">Б</button></div></div><div class="stats"><div class="stat"><strong>${p.length}</strong><span>упражнений</span></div><div class="stat"><strong>${done}/${total}</strong><span>подходов</span></div><div class="stat"><strong>${db.history.length}</strong><span>занятий</span></div></div><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div></section>
<div class="timer"><div><div class="eyebrow">Таймер отдыха</div><div class="time" id="timerInline">${clock(timer.left)}</div><div class="tiny muted">Между подходами ${clock(db.settings.rest)} · между упражнениями ${clock(db.settings.exerciseRest)} · ${db.settings.auto?"автостарт включён":"автостарт выключен"}</div><div class="tiny muted">При блокировке Android сигнал не гарантируется</div></div><div class="timerbtns"><button id="timerStart" class="btn secondary">${timer.running?"Пауза":"Старт"}</button><button id="timerReset">Сброс</button></div></div>
<section class="card"><div class="row"><div><div class="eyebrow">Кардио · дорожка или эллипс</div><div class="time" id="cardioClock">${clock(cardioElapsed())}</div><div class="smallnote">Лёгкая разминка 5–8 минут. Таймер работает отдельно от отдыха.</div></div><div class="actions"><button class="mini" id="cardioToggle">${cardio.running?"Пауза":"Старт"}</button><button class="mini" id="cardioReset">Сброс</button></div></div></section>
<section class="card"><div class="row"><div><div class="eyebrow">Общее время тренировки</div><div class="time" id="sessionClock">${durationText(activeSeconds())}</div><div class="smallnote">Запускается при первом выполненном подходе, сохраняется при закрытии страницы</div></div><button class="mini" id="sessionStart">${started?"Идёт":"Начать"}</button></div></section>
<div class="row section"><span>Упражнения дня ${day}</span><button class="txtbtn" id="addEx">＋ Добавить</button></div>
<div id="exerciseList">${p.map((e,i)=>exerciseCard(e,i)).join("")}</div>
<button class="btn secondary block" id="addBottom">＋ Добавить упражнение</button>
<button class="btn primary block" id="finish">${started?"Завершить и сохранить":"Сохранить тренировку"}</button>
<p class="smallnote" style="text-align:center;margin-top:9px">Подходы сохраняются автоматически. Останавливай подход при потере правильной техники — это технический отказ, а не попытка любой ценой выжать ещё повторение.</p>`;
if($("#apply42"))$("#apply42").onclick=applyProgram42;
document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{day=b.dataset.day;render()});
$("#cardioToggle").onclick=cardioToggle;$("#cardioReset").onclick=cardioReset;
$("#sessionStart").onclick=()=>{if(!db.active||db.active.day!==day){db.active={day,startedAt:new Date().toISOString()};persist();render();}else toast("Тренировка уже идёт")};
$("#addEx").onclick=$("#addBottom").onclick=()=>editExercise(null);
$("#finish").onclick=finish;
$("#timerStart").onclick=()=>timer.running?pauseTimer():startTimer();$("#timerReset").onclick=resetTimer;
bindExerciseInputs();
}
function exerciseCard(e,i){let advice=progression(e,day),prev=lastExercise(e.name,day);return `<article class="exercise" draggable="true" data-card="${e.id}"><div class="exhead"><div style="min-width:0"><div class="exname">☰ ${i+1}. ${esc(e.name)}</div><div class="exmeta">Рабочие подходы: ${e.sets.filter(s=>s.kind!=="warmup").length} · диапазон ${e.min}–${e.target} повторений</div><span class="target">ДВОЙНАЯ ПРОГРЕССИЯ</span></div><div class="actions"><button class="mini" data-edit="${e.id}">✎</button><button class="mini" data-del="${e.id}">×</button></div></div>
<button class="guideOpen" data-guide="${e.id}">▶ Техника · анатомия · движение · видео</button>
<div class="ready ${advice.type==="up"?"":advice.type==="good"?"":"warning"}">${advice.type==="up"?"⬆ ":advice.type==="good"?"✓ ":"ℹ "}${esc(advice.text)}</div>
${prev?`<div class="tiny muted" style="margin-top:8px">Прошлый раз: ${prev.sets.filter(s=>s.kind!=="warmup").map(s=>(s.weight||0)+" кг × "+(s.reps||0)).join(" · ")}</div>`:""}
<div class="sethead"><span>№</span><span>Вес, кг</span><span>Повторы</span><span>✓</span></div>
${e.sets.map((s,j)=>`<div class="setrow"><div class="setno">${s.kind==="warmup"?"Р":e.sets.slice(0,j+1).filter(z=>z.kind!=="warmup").length}</div><input class="field" type="number" inputmode="decimal" step=".5" min="0" value="${s.weight??""}" placeholder="кг" data-field="weight" data-id="${e.id}" data-i="${j}"><input class="field" type="number" inputmode="numeric" min="0" value="${s.reps??""}" placeholder="пов." data-field="reps" data-id="${e.id}" data-i="${j}"><button class="check ${s.done?"on":""}" data-check="${e.id}" data-i="${j}">${s.done?"✓":"○"}</button></div>`).join("")}
<div class="setrow" style="grid-template-columns:28px 1fr 1fr 42px;margin-top:8px"><div></div><div class="tiny muted" style="grid-column:span 2">RIR — повторы в запасе (необязательно)</div><div></div></div>
${e.sets.map((s,j)=>`<div class="setrow" style="grid-template-columns:28px 1fr 1fr 42px;margin-top:5px"><div class="setno">R</div><select class="field" style="grid-column:span 2" data-field="rir" data-id="${e.id}" data-i="${j}"><option value="">Не указано</option>${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${String(s.rir)===String(v)?"selected":""}>${v} в запасе</option>`).join("")}</select><button class="mini" data-remove-set="${e.id}" data-i="${j}" title="Удалить подход">−</button></div>`).join("")}
<div class="exfoot"><button class="txtbtn" data-add-warmup="${e.id}">＋ Разминка</button><button class="txtbtn" data-add-set="${e.id}">＋ Подход</button><div class="actions"><button class="txtbtn" data-up="${e.id}">↑</button><button class="txtbtn" data-down="${e.id}">↓</button><span class="tiny muted">${e.sets.filter(s=>s.done&&s.kind!=="warmup").length}/${e.sets.filter(s=>s.kind!=="warmup").length} рабочих выполнено</span></div></div></article>`}
function bindExerciseInputs(){
document.querySelectorAll("[data-guide]").forEach(b=>b.onclick=()=>showGuide(b.dataset.guide));
document.querySelectorAll("[data-field]").forEach(el=>el.onchange=()=>{let e=prog(day).find(x=>x.id===el.dataset.id),s=e.sets[+el.dataset.i],k=el.dataset.field;s[k]=k==="rir"?(el.value===""?"":+el.value):(el.value===""?"":+el.value);persist();if(k==="reps")render()});
document.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{let e=prog(day).find(x=>x.id===b.dataset.check),s=e.sets[+b.dataset.i];s.done=!s.done;persist();if(s.done){
 if(s.kind!=="warmup"&&(!db.active||db.active.day!==day)){db.active={day,startedAt:new Date().toISOString()}}
 if(db.settings.auto&&s.kind!=="warmup"){
  const allDone=e.sets.filter(x=>x.kind!=="warmup").every(x=>x.done);
  const ix=prog(day).findIndex(x=>x.id===e.id);
  const hasNextPending=prog(day).slice(ix+1).some(x=>x.sets.some(z=>z.kind!=="warmup"&&!z.done));
  if(allDone&&hasNextPending)beginRest("exercise");
  else if(!allDone)beginRest("set");
  else resetTimer();
 }
 persist();
}render();if(s.done&&s.kind!=="warmup")showSetAdvice(e,+b.dataset.i)});
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editExercise(b.dataset.edit));
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteExercise(b.dataset.del));
document.querySelectorAll("[data-add-warmup]").forEach(b=>b.onclick=()=>{let e=prog(day).find(x=>x.id===b.dataset.addWarmup);e.sets.unshift({weight:"",reps:"",rir:"",done:false,kind:"warmup"});persist();render()});
document.querySelectorAll("[data-add-set]").forEach(b=>b.onclick=()=>{let e=prog(day).find(x=>x.id===b.dataset.addSet),last=e.sets.at(-1)||{};e.sets.push({weight:last.weight??"",reps:"",rir:"",done:false});persist();render()});
document.querySelectorAll("[data-remove-set]").forEach(b=>b.onclick=()=>{let e=prog(day).find(x=>x.id===b.dataset.removeSet);if(e.sets.filter(s=>s.kind!=="warmup").length<=1&&e.sets[+b.dataset.i].kind!=="warmup"){toast("В упражнении должен остаться хотя бы один подход");return}e.sets.splice(+b.dataset.i,1);persist();render()});
document.querySelectorAll("[data-up],[data-down]").forEach(b=>b.onclick=()=>moveExercise(b.dataset.up||b.dataset.down,b.hasAttribute("data-up")?-1:1));
document.querySelectorAll("[data-card]").forEach(card=>{card.ondragstart=()=>{dragId=card.dataset.card};card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();if(!dragId||dragId===card.dataset.card)return;let arr=prog(day),from=arr.findIndex(x=>x.id===dragId),to=arr.findIndex(x=>x.id===card.dataset.card);let [it]=arr.splice(from,1);arr.splice(to,0,it);dragId=null;persist();render()}})
}
function moveExercise(id,dir){let a=prog(day),i=a.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist();render()}
function editExercise(id){let e=id?prog(day).find(x=>x.id===id):null;editing=id;modal(`<h2>${e?"Настроить упражнение":"Добавить упражнение"}</h2><div class="form"><label>Название</label><input id="fName" value="${esc(e?.name||"")}" placeholder="Название упражнения"></div><div class="two"><div class="form"><label>Нижняя граница повторений</label><input id="fMin" type="number" min="1" max="30" value="${e?.min??8}"></div><div class="form"><label>Верхняя граница</label><input id="fMax" type="number" min="1" max="30" value="${e?.target??12}"></div></div><div class="form"><label>Количество рабочих подходов</label><input id="fSets" type="number" min="1" max="12" value="${e?.sets.filter(s=>s.kind!=="warmup").length??2}"></div><button class="btn primary block" id="saveExercise">Сохранить</button><button class="btn secondary block" id="cancel">Отмена</button>`);
$("#saveExercise").onclick=()=>{let name=$("#fName").value.trim(),min=+$("#fMin").value,max=+$("#fMax").value,n=Math.max(1,Math.min(12,+$("#fSets").value||2));if(!name||min<1||max<min){toast("Проверь название и диапазон");return}if(e){e.name=name;e.min=min;e.target=max;while(e.sets.filter(s=>s.kind!=="warmup").length<n)e.sets.push({weight:e.sets.at(-1)?.weight??"",reps:"",rir:"",done:false});e.sets=[...e.sets.filter(s=>s.kind==="warmup"),...e.sets.filter(s=>s.kind!=="warmup").slice(0,n)]}else prog(day).push({id:uid(),name,min,target:max,sets:Array.from({length:n},()=>({weight:"",reps:"",rir:"",done:false}))});persist();closeModal();render()};
$("#cancel").onclick=closeModal}
function deleteExercise(id){if(!confirm("Удалить упражнение из программы?"))return;let a=prog(day),i=a.findIndex(x=>x.id===id);a.splice(i,1);persist();render()}
function modal(content){$("#modal").innerHTML=content;$("#modalbg").classList.add("show")}
function closeModal(){$("#modalbg").classList.remove("show")}
$("#modalbg").onclick=e=>{if(e.target.id==="modalbg")closeModal()};
function beginRest(kind){resetTimer();timer.kind=kind;timer.left=kind==="exercise"?db.settings.exerciseRest:db.settings.rest;startTimer()}
function startTimer(){if(timer.running)return;prepareSound();if(timer.left<=0)timer.left=timer.kind==="exercise"?db.settings.exerciseRest:db.settings.rest;alarmDelivered=false;timer.running=true;timer.end=Date.now()+timer.left*1000;timerSave();clearInterval(timer.id);timer.id=setInterval(tick,250);updateTimerUI()}
function pauseTimer(){if(!timer.running)return;timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timer.running=false;clearInterval(timer.id);timer.id=null;timerSave();updateTimerUI()}
function resetTimer(){timer.running=false;clearInterval(timer.id);timer.id=null;timer.left=db.settings.rest;timer.kind="set";alarmDelivered=false;timerSave();updateTimerUI()}
function adjustTimer(v){if(timer.running){timer.end=Math.max(Date.now(),timer.end+v*1000);timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timerSave();tick()}else{timer.left=Math.max(0,timer.left+v);updateTimerUI()}}
function tick(){if(!timer.running)return;timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));if(timer.left===0){completeTimer();return}updateTimerUI()}
window.addEventListener("focus",tick);window.addEventListener("pageshow",tick);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
function updateTimerUI(){let t=clock(timer.left);$("#timerText").textContent=t;$("#timerKind").textContent=timer.kind==="exercise"?"Отдых между упражнениями":"Отдых между подходами";let inline=$("#timerInline");if(inline)inline.textContent=t;$("#timerFloat").classList.toggle("show",timer.running||timer.left!==(timer.kind==="exercise"?db.settings.exerciseRest:db.settings.rest));$("#timerPause").textContent=timer.running?"Пауза":"Старт"}
$("#timerMinus").onclick=()=>adjustTimer(-30);$("#timerPlus").onclick=()=>adjustTimer(30);$("#timerPause").onclick=()=>timer.running?pauseTimer():startTimer();$("#timerStop").onclick=()=>{resetTimer();$("#timerFloat").classList.remove("show")};
function activeSeconds(){return db.active&&db.active.startedAt?Math.max(0,Math.floor((Date.now()-new Date(db.active.startedAt).getTime())/1000)):0}
function durationText(sec){if(!Number.isFinite(sec)||sec<=0)return "—";return Math.floor(sec/3600)+" ч "+Math.floor(sec%3600/60)+" мин"}
function totalVolume(h){return h.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done&&x.kind!=="warmup").reduce((b,x)=>b+(Number(x.weight)||0)*(Number(x.reps)||0),0),0)}
function completedSets(h){return h.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done&&x.kind!=="warmup").length,0)}
function kcalEstimate(h){if(!h.durationSec||!h.bodyWeight||!h.intensity)return null;return Math.round(h.intensity*3.5*h.bodyWeight/200*(h.durationSec/60))}
function reportText(records){
 const lines=["IRON LOG V4.2 — ОТЧЁТ ДЛЯ CHATGPT","Данные из дневника тренировок; оцени прогрессию, восстановление и недельный объём. Учитывай различия упражнений и качество данных.",""];
 for(const h of records){
  lines.push("День "+h.day+" · "+h.date,"Длительность: "+durationText(h.durationSec),"Подходов: "+completedSets(h),"Тоннаж (вес × повторения): "+Math.round(totalVolume(h))+" кг");
  const kc=kcalEstimate(h);if(kc!==null)lines.push("Расход энергии: ≈"+kc+" ккал (грубая оценка MET, не измерение)");
  h.exercises.forEach(e=>{const sets=e.sets.filter(x=>x.done&&x.kind!=="warmup");if(!sets.length)return;lines.push("• "+e.name+": "+sets.map(x=>(x.weight===""?"без веса":x.weight+" кг")+" × "+(x.reps||0)+(x.rir!==""&&x.rir!=null?" (RIR "+x.rir+")":"")).join(" / "))});
  lines.push("");
 }
 return lines.join("\n");
}
async function copyReport(text){try{await navigator.clipboard.writeText(text);toast("Отчёт скопирован")}catch(e){let el=$("#reportText");if(el){el.focus();el.select()}toast("Выдели текст и скопируй вручную")}}
function downloadReport(text){let url=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="iron-log-report-"+today()+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function reportModal(records){if(!records.length){toast("Нет сохранённых тренировок");return}let t=reportText(records);modal('<h2>Отчёт для ChatGPT</h2><p class="smallnote">Скопируй текст в чат для анализа или скачай TXT.</p><textarea class="reportBox" id="reportText" readonly></textarea><button class="btn primary block" id="copyReport">📋 Скопировать</button><button class="btn secondary block" id="downloadReport">Скачать TXT</button><button class="btn secondary block" id="closeReport">Закрыть</button>');$("#reportText").value=t;$("#copyReport").onclick=()=>copyReport(t);$("#downloadReport").onclick=()=>downloadReport(t);$("#closeReport").onclick=closeModal}
function summaryModal(h){const kc=kcalEstimate(h),t=reportText([h]);modal('<h2>Тренировка завершена!</h2><div class="summaryGrid"><div class="stat"><strong>'+durationText(h.durationSec)+'</strong><span>Длительность</span></div><div class="stat"><strong>'+completedSets(h)+'</strong><span>Подходов</span></div><div class="stat"><strong>'+Math.round(totalVolume(h))+' кг</strong><span>Тоннаж*</span></div><div class="stat"><strong>'+(kc===null?"—":"≈ "+kc)+'</strong><span>Ккал, оценка</span></div></div><p class="smallnote">*Тоннаж не равен расходу калорий. Ккал рассчитаны по массе тела, длительности и выбранному MET. Показатель приблизительный.</p><button class="btn primary block" id="summaryCopy">📋 Копировать для ChatGPT</button><button class="btn secondary block" id="summaryTxt">Скачать TXT</button><button class="btn secondary block" id="summaryClose">Закрыть</button>');$("#summaryCopy").onclick=()=>copyReport(t);$("#summaryTxt").onclick=()=>downloadReport(t);$("#summaryClose").onclick=closeModal}
function finish(){let arr=prog(day),done=arr.reduce((n,e)=>n+e.sets.filter(s=>s.done&&s.kind!=="warmup").length,0);if(!done&&!confirm("Не отмечено ни одного подхода. Всё равно сохранить занятие?"))return;let note="";let rec={id:uid(),date:today(),created:new Date().toISOString(),day,completed:done,durationSec:activeSeconds(),bodyWeight:Number(db.settings.bodyWeight)||null,intensity:Number(db.settings.intensity)||null,exercises:arr.map(e=>({id:e.id,name:e.name,min:e.min,target:e.target,sets:e.sets.map(s=>({...s}))})),note};db.history.unshift(rec);arr.forEach(e=>e.sets.forEach(s=>s.done=false));db.nextDay=day==="A"?"B":"A";db.active=null;persist();resetTimer();toast("Сохранено. Следующий день: "+db.nextDay);day=db.nextDay;render();summaryModal(rec)}
function renderHistory(){if(!db.history.length){$("#main").innerHTML='<div class="card empty"><b>История пока пуста</b>Заверши первую тренировку — результаты появятся здесь.</div>';return}
$("#main").innerHTML=`<div class="card"><div class="eyebrow">Журнал</div><h2>История тренировок</h2><div class="sub">${db.history.length} сохранённых занятий</div></div><div class="card"><button class="btn primary block" id="allReports">📋 Отчёт для ChatGPT · вся история</button><button class="btn secondary block" id="recentReports">Последние 30 дней</button></div><div class="card">${db.history.map(h=>{let volume=h.exercises.reduce((n,e)=>n+e.sets.reduce((m,s)=>m+(+s.weight||0)*(+s.reps||0),0),0);return `<div class="history"><div class="row"><b>День ${h.day} · ${dateFmt(h.date)}</b><span class="badge">${h.completed} подходов</span></div><div class="tiny muted" style="margin:6px 0">${h.exercises.length} упражнений · объём ${Math.round(volume).toLocaleString("ru-RU")} кг</div><div class="row"><button class="txtbtn" data-details="${h.id}">Подробнее →</button><button class="txtbtn" style="color:var(--red)" data-delete-record="${h.id}">Удалить</button></div></div>`}).join("")}</div>`;
$("#allReports").onclick=()=>reportModal(db.history);
$("#recentReports").onclick=()=>reportModal(db.history.filter(h=>Date.now()-new Date(h.created||h.date).getTime()<=30*86400000));
document.querySelectorAll("[data-details]").forEach(b=>b.onclick=()=>details(b.dataset.details));document.querySelectorAll("[data-delete-record]").forEach(b=>b.onclick=()=>{if(confirm("Удалить тренировку из истории?")){db.history=db.history.filter(x=>x.id!==b.dataset.deleteRecord);persist();render()}})}
function details(id){let h=db.history.find(x=>x.id===id);modal(`<h2>День ${h.day} · ${dateFmt(h.date)}</h2>${h.exercises.map(e=>`<div class="history"><b>${esc(e.name)}</b><div class="tiny muted" style="margin-top:5px">${e.sets.map((s,i)=>`${s.kind==="warmup"?"Разминка":i+1}. ${s.weight||0} кг × ${s.reps||0}${s.rir!==""&&s.rir!=null?" · RIR "+s.rir:""}`).join("<br>")}</div></div>`).join("")}<button class="btn primary block" id="oneReport">📋 Отчёт для ChatGPT</button><button class="btn secondary block" id="closeDetails">Закрыть</button>`);$("#oneReport").onclick=()=>reportModal([h]);$("#closeDetails").onclick=closeModal}
function renderStats(){let by={};db.history.slice().reverse().forEach(h=>h.exercises.forEach(e=>{let vals=e.sets.filter(s=>s.kind!=="warmup"&&s.done&&+s.weight>0).map(s=>+s.weight);if(vals.length){by[e.name]??=[];by[e.name].push({date:h.date,max:Math.max(...vals)})}}));let names=Object.keys(by),prs=names.map(n=>({name:n,max:Math.max(...by[n].map(x=>x.max))})).sort((a,b)=>b.max-a.max);let count=db.history.length,vol=db.history.reduce((n,h)=>n+h.exercises.reduce((m,e)=>m+e.sets.filter(s=>s.kind!=="warmup"&&s.done).reduce((k,s)=>k+(+s.weight||0)*(+s.reps||0),0),0),0);
$("#main").innerHTML=`<div class="card"><div class="eyebrow">Тренировочная аналитика</div><h2>Прогресс</h2><div class="stats"><div class="stat"><strong>${count}</strong><span>тренировок</span></div><div class="stat"><strong>${Math.round(vol).toLocaleString("ru-RU")}</strong><span>кг объёма*</span></div><div class="stat"><strong>${prs.length}</strong><span>упражнений с данными</span></div></div><div class="tiny muted" style="margin-top:8px">*Сумма веса × повторения по сохранённым подходам.</div></div>
<div class="card"><b>Лучшие рабочие веса</b>${prs.length?prs.map(x=>`<div class="history row"><span>${esc(x.name)}</span><b>${x.max} кг</b></div>`).join(""):'<div class="empty">Данные появятся после сохранения занятий.</div>'}</div>
<div class="card"><b>График рабочего веса</b><div class="form"><select id="chartSelect">${names.map(n=>`<option>${esc(n)}</option>`).join("")}</select></div><canvas id="chart" width="640" height="250"></canvas><p class="smallnote">График показывает максимальный записанный вес упражнения в каждой тренировке. Сравнивай только одинаковые варианты упражнения и одинаковую технику.</p></div>
<div class="card"><b>Как работает двойная прогрессия</b><p class="smallnote" style="margin-top:8px">1. Сохраняй выбранный рабочий вес и постепенно добавляй повторения в диапазоне ${prog("A")[0]?.min||8}–${prog("A")[0]?.target||12}.<br>2. Когда первый рабочий подход достигает верхней границы диапазона близко к техническому отказу, на следующем занятии можно увеличить вес минимальным шагом. В последующих подходах допустимо снижение до двух повторений относительно первого.<br>3. После увеличения веса повторения обычно снова окажутся ближе к нижней границе. Продолжай цикл.<br>Подсказка приложения — ориентир, а не требование повышать вес любой ценой. Техника и контроль важнее.</p></div>`;
if(names.length){$("#chartSelect").onchange=drawChart;drawChart()}}
function drawChart(){let name=$("#chartSelect").value,vals=db.history.slice().reverse().map(h=>{let e=h.exercises.find(x=>x.name===name);return e?{date:h.date,v:Math.max(0,...e.sets.filter(s=>s.kind!=="warmup").map(s=>+s.weight||0))}:null}).filter(x=>x&&x.v>0),c=$("#chart"),ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);if(!vals.length)return;let max=Math.max(...vals.map(x=>x.v))*1.15,min=Math.min(...vals.map(x=>x.v))*.85;ctx.strokeStyle="#34445f";ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(25,h*i/4);ctx.lineTo(w-20,h*i/4);ctx.stroke()}ctx.strokeStyle="#b9f34b";ctx.lineWidth=4;ctx.beginPath();vals.forEach((p,i)=>{let x=30+(w-60)*(vals.length===1?.5:i/(vals.length-1)),y=h-28-(p.v-min)/(max-min||1)*(h-60);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();vals.forEach((p,i)=>{let x=30+(w-60)*(vals.length===1?.5:i/(vals.length-1)),y=h-28-(p.v-min)/(max-min||1)*(h-60);ctx.fillStyle="#b9f34b";ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e9f2ff";ctx.font="18px system-ui";ctx.fillText(p.v+"кг",x-20,y-13)})}
$("#backup").onclick=()=>{modal(`<h2>Резервная копия</h2><p class="smallnote">Экспортируй программу, настройки и историю в JSON. Импорт восстановит данные из такого файла.</p><button class="btn primary block" id="export">Скачать резервную копию</button><button class="btn secondary block" id="import">Восстановить из файла</button><button class="btn secondary block" id="closeBackup">Закрыть</button>`);$("#export").onclick=exportData;$("#import").onclick=()=>{$("#file").click();closeModal()};$("#closeBackup").onclick=closeModal};
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="iron-log-v2-"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("Резервная копия скачана")}
$("#file").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.program||!Array.isArray(x.history))throw 0;if(confirm("Импорт заменит текущие данные. Продолжить?")){db=migrateProgram(x);db.settings={rest:90,exerciseRest:150,bodyWeight:74,intensity:4.5,cardioGoal:5,auto:true,step:2.5,sound:true,vibration:true,notifications:true,...db.settings};persist();render();toast("Данные восстановлены")}}catch(_){alert("Файл не похож на резервную копию IRON LOG")}e.target.value=""};
$("#settings").onclick=()=>{modal(`<h2>Настройки</h2><div class="form"><label>Отдых между подходами, секунд</label><input id="rest" type="number" min="15" max="900" value="${db.settings.rest}"></div><div class="form"><label>Отдых между упражнениями, секунд</label><input id="exerciseRest" type="number" min="15" max="900" value="${db.settings.exerciseRest}"></div><div class="form"><label>Масса тела, кг (для оценки калорий)</label><input id="bodyWeight" type="number" min="20" max="350" step=".1" value="${db.settings.bodyWeight}"></div><div class="form"><label>Интенсивность MET (условный коэффициент)</label><select id="intensity"><option value="3.5" ${db.settings.intensity==3.5?"selected":""}>3.5 — умеренная</option><option value="4.5" ${db.settings.intensity==4.5?"selected":""}>4.5 — средняя</option><option value="6" ${db.settings.intensity==6?"selected":""}>6 — интенсивная</option></select><p class="smallnote">Калории — приблизительная оценка, не измерение.</p></div><div class="form"><label>Автозапуск таймера после отметки подхода</label><select id="auto"><option value="true" ${db.settings.auto?"selected":""}>Включён</option><option value="false" ${!db.settings.auto?"selected":""}>Выключен</option></select></div><div class="form"><label>Звуковой сигнал</label><select id="sound"><option value="true" ${db.settings.sound!==false?"selected":""}>Включён</option><option value="false" ${db.settings.sound===false?"selected":""}>Выключен</option></select></div><div class="form"><label>Вибрация</label><select id="vibration"><option value="true" ${db.settings.vibration!==false?"selected":""}>Включена</option><option value="false" ${db.settings.vibration===false?"selected":""}>Выключена</option></select></div><div class="form"><label>Системные уведомления (если поддерживаются)</label><select id="notifications"><option value="true" ${db.settings.notifications!==false?"selected":""}>Включены</option><option value="false" ${db.settings.notifications===false?"selected":""}>Выключены</option></select><button class="btn secondary block" id="requestNotifications" type="button">Разрешить уведомления</button><p class="smallnote">Разрешение само по себе не гарантирует сигнал при заблокированном экране. Повторного сигнала через 30 секунд нет.</p></div><div class="form"><label>Шаг увеличения веса (подсказка)</label><input id="step" type="number" min=".25" max="20" step=".25" value="${db.settings.step}"></div><button class="btn primary block" id="saveSettings">Сохранить</button><button class="btn secondary block" id="resetProgram">Сбросить программу к исходной</button><button class="btn danger block" id="clearHistory">Очистить историю</button><button class="btn secondary block" id="closeSettings">Закрыть</button>`);
$("#requestNotifications").onclick=enableNotifications;
$("#saveSettings").onclick=()=>{db.settings.sound=$("#sound").value==="true";db.settings.vibration=$("#vibration").value==="true";db.settings.notifications=$("#notifications").value==="true";db.settings.rest=Math.max(15,Math.min(900,+$("#rest").value||90));db.settings.exerciseRest=Math.max(15,Math.min(900,+$("#exerciseRest").value||150));db.settings.bodyWeight=Math.max(20,Math.min(350,+$("#bodyWeight").value||74));db.settings.intensity=+$("#intensity").value||4.5;db.settings.auto=$("#auto").value==="true";db.settings.step=Math.max(.25,+$("#step").value||2.5);persist();resetTimer();closeModal();render();toast("Настройки сохранены")};
$("#resetProgram").onclick=()=>{if(confirm("Вернуть исходные упражнения и веса? История сохранится.")){db.program=structuredClone(seed);persist();closeModal();render()}};
$("#clearHistory").onclick=()=>{if(confirm("Безвозвратно очистить историю?")){db.history=[];persist();closeModal();render()}};
$("#closeSettings").onclick=closeModal};
if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
restoreTimer();
render();
sessionTicker=setInterval(()=>{let el=$("#sessionClock");if(el)el.textContent=durationText(activeSeconds());let cc=$("#cardioClock");if(cc)cc.textContent=clock(cardioElapsed())},1000);
